name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Active LTS lines only; testcontainers >= 12 requires Node >= 22.22.
        node: [ "22", "24" ]
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runtime dependencies only; dev tooling is audited by Dependabot.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      # Also runs publint + "Are the types wrong?" on the emitted package.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Docker-free. Coverage of src/ is collected and enforced here (>= 95%).
      - name: Unit tests (with coverage)
        run: pnpm test:unit --coverage

      # A real WireMock container (ubuntu-latest ships Docker). Never --no-docker: refused in CI.
      - name: E2E tests
        run: pnpm test:e2e

  # The built package, consumed via `npm link` by the standalone examples/ project.
  examples:
    name: Examples – npm-link consumer E2E on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ "22", "24" ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install library dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm build

      - name: Register the package globally (npm link)
        run: npm link

      - name: Install the examples project
        working-directory: examples
        run: npm install

      - name: Link the library into the examples project
        working-directory: examples
        run: npm run link:library

      - name: Typecheck the examples project
        working-directory: examples
        run: npm run typecheck

      # Never --no-docker: refused in CI.
      - name: Run the end-user E2E flow
        working-directory: examples
        run: npm test
