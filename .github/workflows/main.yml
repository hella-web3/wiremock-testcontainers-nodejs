name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Active LTS lines only; testcontainers >= 12 requires Node >= 22.22.
        node: [ "22", "24" ]
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runtime dependencies only; dev tooling is audited by Dependabot.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=high

      # Also runs publint + "Are the types wrong?" on the emitted package.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Docker-free. Coverage of src/ is collected and enforced here (>= 95%).
      - name: Unit tests (with coverage)
        run: pnpm test:unit --coverage

      # Starts a real WireMock container; ubuntu-latest runners ship with Docker.
      - name: E2E tests
        run: pnpm test:e2e
