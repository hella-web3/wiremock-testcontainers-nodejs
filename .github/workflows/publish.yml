name: Publish to NPM

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    environment: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write # Required to publish to GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Docker-free gate before anything reaches the registry.
      - name: Verify
        run: pnpm typecheck && pnpm lint && pnpm test:unit --coverage

      - name: Build
        run: pnpm build

      - name: Publish to NPM
        run: pnpm publish --no-git-checks --access public --provenance

      # Mirror to GitHub Packages
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/}"
          cat > "$RUNNER_TEMP/.npmrc.gpr" <<EOF
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc.gpr" \
            pnpm publish --no-git-checks --registry https://npm.pkg.github.com
